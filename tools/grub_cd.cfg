serial --unit=0 --speed=38400 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial
search --no-floppy --set=root --file /boot/kernel.bin || set root=(cd0)
set prefix=($root)/boot/grub
# 使用 GRUB 帧缓冲：真机无 Bochs dispi 端口，只能靠 GRUB 提供线性帧缓冲，
# 内核据此在帧缓冲上渲染文本菜单与图形模式。若显卡无法进入该模式，
# GRUB 会自动回退文本(kernel 端 mb2FindFramebuffer 找不到 fb 即走 VGA 文本平面)。
insmod vbe
insmod vga
# 回退链：优先 1024x768x32；显卡不支持时依次降级，任何 VBE 显卡都能拿到帧缓冲。
set gfxmode=1024x768x32,1024x768x24,1024x768,800x600x32,auto
set gfxpayload=keep
multiboot2 /boot/kernel.bin
# 把 system 运行目录与安装所需文件作为 multiboot2 模块送入内存：
# 真机从 U盘 启动时内核无 USB 存储驱动、SATA 光驱在 AHCI 模式下 ATAPI 也读不到，
# 这些模块成为字体/壁纸/图形程序/安装源的统一后备，保证任何设备行为一致。
# 用法: module2 <CD路径> <内核侧虚拟路径>
module2 /system/font/font.bin /system/font/font.bin
module2 /system/font/cjk16.bin /system/font/cjk16.bin
module2 /system/images/wallpaper.bmp /system/images/wallpaper.bmp
module2 /system/images/taskbar.bmp /system/images/taskbar.bmp
module2 /system/images/vortex.bmp /system/images/vortex.bmp
module2 /system/images/mousePointer/arrow.bmp /system/images/mousepointer/arrow.bmp
module2 /system/images/mousePointer/textSelect.bmp /system/images/mousepointer/textselect.bmp
module2 /system/programs/My_UI.elf /system/programs/My_UI.elf
module2 /boot/kernel.bin /boot/kernel.bin
module2 /boot/grub/grub.cfg /boot/grub/grub.cfg
module2 /grub/core.img /grub/core.img
module2 /grub/hdd_mbr.bin /grub/hdd_mbr.bin
boot